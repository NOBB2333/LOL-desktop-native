name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Logic and Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install Native SDK
        run: npm install --global @native-sdk/cli@0.10.1

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Test Zig backend
        shell: bash
        run: |
          sdk_path="$(npm root --global)/@native-sdk/cli"
          zig build test -Dplatform=null "-Dnative-sdk-path=$sdk_path" --summary all

  windows-build:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install Native SDK
        run: npm install --global @native-sdk/cli@0.10.1

      - name: Read and verify version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content app.json -Raw | ConvertFrom-Json).version
          $frontendVersion = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if (-not $appVersion -or $appVersion -ne $frontendVersion) {
            throw "Version mismatch: app.json=$appVersion, frontend/package.json=$frontendVersion"
          }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$appVersion") {
            throw "Tag $($env:REF_NAME) does not match project version v$appVersion"
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build single-file package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path zig-out/package
          $expected = Join-Path $packageRoot 'lol-desktop-native.exe'
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Missing single-file output: $expected"
          }
          $unexpected = @(Get-ChildItem -LiteralPath $packageRoot -Force | Where-Object { $_.FullName -ne $expected })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected package output: $($unexpected.Name -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path release-metadata | Out-Null
          $hash = (Get-FileHash -LiteralPath $expected -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lol-desktop-native.exe" | Set-Content release-metadata/checksums-sha256.txt -Encoding utf8NoBOM

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol-desktop-native-windows-v${{ steps.version.outputs.version }}
          path: zig-out/package/lol-desktop-native.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 桌上英雄联盟 Native ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            zig-out/package/lol-desktop-native.exe
            release-metadata/checksums-sha256.txt
